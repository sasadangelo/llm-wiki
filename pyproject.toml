[project]
authors = [
  {name = "Salvatore D'Angelo", email = "sasadangelo@gmail.com"},
]
dependencies = [
  "requests>=2.32.0",
  "markdownify>=0.13.0",
  "beautifulsoup4>=4.12.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "langchain-ibm>=1.0.10",
  "ibm-watsonx-ai>=1.3.42",
]
description = "LLM Wiki - A living knowledge base about AI Agents"
keywords = ["llm", "wiki", "ai-agents", "knowledge-base"]
name = "llm-wiki"
readme = "README.md"
requires-python = ">=3.10,<3.15"
version = "0.1.0"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.11.0",
  "detect-secrets>=1.5.0",
  "mypy>=1.18.2",
  "poethepoet>=0.37.0",
  "pre-commit>=3.8.0",
  "pytest>=8.4.2",
  "radon>=6.0.1",
  "ruff>=0.8.0",
  "types-requests>=2.32.0",
  "types-beautifulsoup4>=4.12.0",
  "types-pyyaml>=6.0",
]

[tool.ruff]
exclude = [
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), isort (I), and other useful rules
ignore = []
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
lines-between-types = 0
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
